<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Web Scraper Graphic: Web Grid + Spider/Extractor Claw Nodes -->
  <!-- Web radar/grid lines -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-opacity="0.3"/>
  <circle cx="64" cy="64" r="24" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-opacity="0.4"/>
  <circle cx="64" cy="64" r="10" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-opacity="0.6"/>
  
  <!-- Radial lines -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="#5eead4" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="#5eead4" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="33" y1="33" x2="95" y2="95" stroke="#5eead4" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="95" y1="33" x2="33" y2="95" stroke="#5eead4" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Center Core Node / Spider Body -->
  <circle cx="64" cy="64" r="12" fill="#ffffff" />
  <circle cx="64" cy="64" r="7" fill="#0f766e" />

  <!-- Data extraction nodes / Claw arms -->
  <path d="M64 40 L50 24 M64 40 L78 24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 64 L24 50 M40 64 L24 78" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 88 L50 104 M64 88 L78 104" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M88 64 L104 50 M88 64 L104 78" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <circle cx="50" cy="24" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="78" cy="24" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="24" cy="50" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="24" cy="78" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="50" cy="104" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="78" cy="104" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="104" cy="50" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="104" cy="78" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
</svg>
